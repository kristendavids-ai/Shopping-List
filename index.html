<title>Our Nest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: cream phone column; orange balance card with red circles; outlined tiles; colour cards overlap like a wallet and expand in place; black pill nav */
:root{
  --bg:#F3EAD0; --deep:#E8DDBD; --ink:#111111; --muted:#7A735F; --faint:#ADA58C; --line:rgba(17,17,17,.24); --line-soft:rgba(17,17,17,.1); --chip:rgba(17,17,17,.06);
  --solid:#111111; --on-solid:#F3EAD0; --sheet:#F6EED8; --danger:#C2321C;
  --nav-bg:#111111; --nav-fg:#F3EAD0; --nav-active:#56534B;
  --on-card:#111111; --on-card-muted:rgba(17,17,17,.58); --card-line:rgba(17,17,17,.14); --card-solid:#111111; --card-on-solid:#F3EAD0;
  --orange:#EB7A52; --red:#DE2B1E; --blue:#9DB7DE; --yellow:#F2D04B; --mint:#8DCDB5; --tan:#B99A70; --olive:#86A06C; --khaki:#CDB27C; --silver:#C6C2B6;
  --sans:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
  --r:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17150F; --deep:#221F17; --ink:#F3EAD0; --muted:#A29A82; --faint:#6A6453; --line:rgba(243,234,208,.22); --line-soft:rgba(243,234,208,.09); --chip:rgba(243,234,208,.07);
  --solid:#F3EAD0; --on-solid:#17150F; --sheet:#1F1C15; --danger:#FF7B62;
  --nav-bg:#2A271F; --nav-fg:#F3EAD0; --nav-active:#4C483D;
  --orange:#E6744B; --red:#D9311F; --blue:#93AED6; --yellow:#E8C743; --mint:#82C3AB; --tan:#AE8F66; --olive:#7E9866; --khaki:#C3A872; --silver:#BBB7AB;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17150F; --deep:#221F17; --ink:#F3EAD0; --muted:#A29A82; --faint:#6A6453; --line:rgba(243,234,208,.22); --line-soft:rgba(243,234,208,.09); --chip:rgba(243,234,208,.07);
  --solid:#F3EAD0; --on-solid:#17150F; --sheet:#1F1C15; --danger:#FF7B62;
  --nav-bg:#2A271F; --nav-fg:#F3EAD0; --nav-active:#4C483D;
  --orange:#E6744B; --red:#D9311F; --blue:#93AED6; --yellow:#E8C743; --mint:#82C3AB; --tan:#AE8F66; --olive:#7E9866; --khaki:#C3A872; --silver:#BBB7AB;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 124px;display:flex;flex-direction:column;gap:24px}
.svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.svg.sm{width:18px;height:18px}
.muted{color:var(--muted)}
.lbl{font-size:11.5px;color:var(--muted)}
.warn{color:var(--danger)}

/* headers: home uses the profile row, other pages the heavy multi-line title */
.top{display:flex;align-items:center;gap:12px}
.top .ttl{flex:1;min-width:0}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.top.page{align-items:flex-start}
.top.page h1{font-size:31px;letter-spacing:-.035em;line-height:1.02}
.top .sub{font-size:13px;color:var(--muted);margin-top:4px}
.circle-btn{width:42px;height:42px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;flex:none}
.pill-btn{box-shadow:inset 0 0 0 1.5px var(--line);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;flex:none}
.pill-btn .svg{width:15px;height:15px}
.avs{display:flex}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--on-card);overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--bg)}
.av img{width:100%;height:100%;object-fit:cover}
.avs .av+.av{margin-left:-12px}
.av.s{width:22px;height:22px;font-size:10px;box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}

/* balance card */
.hero{background:var(--orange);color:var(--on-card);border-radius:24px;padding:18px 20px 20px;position:relative;overflow:hidden;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.hero::after{content:"";position:absolute;right:-70px;top:-34px;width:228px;height:114px;background:radial-gradient(circle at 57px 57px,var(--red) 0 56px,transparent 57px),radial-gradient(circle at 171px 57px,var(--red) 0 56px,transparent 57px);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .lbl{color:var(--on-card-muted);font-size:13px;color:var(--on-card)}
.hero .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.big{font-size:46px;font-weight:400;letter-spacing:-.045em;line-height:.95;font-variant-numeric:tabular-nums}
.big .c{opacity:.45}
.hero .when{font-size:14px;font-weight:500;white-space:nowrap}

/* outlined tiles */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec-head h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.tiles{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px}
.tiles.grid{display:grid;grid-template-columns:1fr 1fr;overflow:visible;margin:0;padding:0}
.tile{box-shadow:inset 0 0 0 1.5px var(--line);border-radius:20px;padding:14px;min-width:164px;flex:none;display:flex;flex-direction:column;gap:14px;color:var(--ink)}
.tiles.grid .tile{min-width:0}
.tile .hd{display:flex;gap:10px;align-items:flex-start}
.tile .amt{font-weight:700;font-size:16px;letter-spacing:-.01em;display:block;font-variant-numeric:tabular-nums}
.tile .sm{font-size:12px;color:var(--muted);display:block}
.tile .nm{font-weight:700;font-size:16px;letter-spacing:-.015em;overflow-wrap:anywhere}
.sqi{width:42px;height:42px;border-radius:11px;background:var(--chip);display:grid;place-items:center;flex:none}
.meter{display:block;height:4px;background:var(--line-soft);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);border-radius:4px}
.meter i.over{background:var(--danger)}

/* wallet stack of colour cards */
.wallet{display:flex;flex-direction:column}
.w{position:relative;border-radius:var(--r);margin-top:-22px;padding-bottom:22px;color:var(--on-card);box-shadow:0 -1px 0 rgba(0,0,0,.04)}
.w:first-child{margin-top:0}
.w:last-child{padding-bottom:0}
.w-head{display:flex;gap:14px;align-items:center;padding:14px 16px;width:100%}
.w .sqi{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.4)}
.w-main{flex:1;min-width:0;display:flex;flex-direction:column}
.w .cat{font-size:11px;color:var(--on-card-muted)}
.w .name{font-weight:700;font-size:17px;letter-spacing:-.015em;overflow-wrap:anywhere;line-height:1.2}
.w .sub{font-size:12.5px;color:var(--on-card-muted);margin-top:1px}
.w .amt{font-weight:700;font-size:17px;letter-spacing:-.015em;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.w .amt small{display:block;font-weight:400;font-size:12px;color:var(--on-card-muted);letter-spacing:0}
.w-more{padding:2px 16px 16px;display:flex;flex-direction:column}
.kv{display:flex;align-items:center;gap:12px;min-height:44px}
.kv .k{width:92px;flex:none;color:var(--on-card-muted);font-size:14px}
.kv .v{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.opill{box-shadow:inset 0 0 0 1.5px rgba(17,17,17,.75);border-radius:99px;padding:7px 15px;font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--on-card)}
.bpill{background:var(--card-solid);color:var(--card-on-solid);border-radius:99px;padding:14px;width:100%;font-weight:600;text-align:center;margin-top:8px}
.c-orange{background:var(--orange)}.c-red{background:var(--red)}.c-blue{background:var(--blue)}.c-yellow{background:var(--yellow)}.c-mint{background:var(--mint)}.c-tan{background:var(--tan)}.c-olive{background:var(--olive)}.c-khaki{background:var(--khaki)}.c-silver{background:var(--silver)}

.empty{box-shadow:inset 0 0 0 1.5px var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty b{font-size:17px;letter-spacing:-.015em}
.empty span{color:var(--muted);max-width:44ch}
.empty .btn{margin-top:6px}
.banner{font-size:12.5px;color:var(--muted);background:var(--chip);border-radius:14px;padding:10px 12px}

/* forms */
.qa{display:flex;gap:8px}
.field{background:transparent;border:0;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:14px;padding:13px 14px;width:100%;min-width:0;outline:none}
.field:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
textarea.field{resize:vertical;min-height:100px;line-height:1.5}
.btn{background:var(--solid);color:var(--on-solid);border-radius:99px;padding:14px 20px;font-weight:600;white-space:nowrap;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px currentColor}
.btn.full{width:100%}
.btn.round{width:50px;height:50px;padding:0;display:grid;place-items:center;flex:none}
.btn:disabled{opacity:.35;cursor:default}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.form label .field{font-size:15px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px}
.chip{box-shadow:inset 0 0 0 1.5px var(--line);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:500;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--solid);color:var(--on-solid);box-shadow:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:99px;padding:4px}
.seg button{border-radius:99px;padding:9px;font-size:14px;font-weight:600;text-align:center}
.seg button[aria-pressed="true"]{background:var(--solid);color:var(--on-solid)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--ink)}

/* shopping items inside aisle cards */
.items{padding:0 16px 10px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--card-line)}
.tick{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.7px currentColor;display:grid;place-items:center;flex:none}
.tick .svg{width:15px;height:15px;stroke-width:2.6;opacity:0}
.item .nm{flex:1;min-width:0;font-size:16px;font-weight:500;overflow-wrap:anywhere}
.item .nm small{display:block;font-size:12px;color:var(--on-card-muted);font-weight:400}
.item .px{font-variant-numeric:tabular-nums;font-size:13px;color:var(--on-card-muted)}
.w.basket{background:var(--solid);color:var(--on-solid)}
.w.basket .sqi{background:rgba(127,127,127,.22)}
.w.basket .cat,.w.basket .sub,.w.basket .item .px,.w.basket .item .nm small{color:var(--faint)}
.w.basket .item{border-color:rgba(127,127,127,.25)}
.w.basket .item .nm{text-decoration:line-through;text-decoration-thickness:1px;color:var(--faint)}
.w.basket .tick{background:var(--on-solid);box-shadow:none}
.w.basket .tick .svg{opacity:1;stroke:var(--solid)}
.w.basket .btn{background:var(--on-solid);color:var(--solid);margin:4px 16px 16px;width:calc(100% - 32px)}

/* recipe sheet */
.ing{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line-soft);width:100%}
.ing .tick{color:var(--ink)}
.ing[aria-pressed="true"] .tick{background:var(--ink);box-shadow:none}
.ing[aria-pressed="true"] .tick .svg{opacity:1;stroke:var(--bg)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;line-height:1.5;max-width:65ch}
.sheet h3{font-size:17px;letter-spacing:-.015em;margin-bottom:6px}

/* moodboard */
.mood{columns:2;column-gap:10px}
.mtile{break-inside:avoid;margin-bottom:10px;border-radius:var(--r);overflow:hidden;color:var(--on-card);position:relative}
.mtile>button{display:block;width:100%}
.mtile img{display:block;width:100%;height:auto}
.mtile .swatch{display:block;aspect-ratio:var(--ar,1)}
.mtile .cap{display:block;padding:10px 12px 12px}
.mtile .cap .cat{font-size:11px;color:var(--on-card-muted);display:block}
.mtile .cap b{font-size:15px;letter-spacing:-.015em;display:block;overflow-wrap:anywhere}
.mtile .cap .p{font-size:13px;font-weight:600}
.heart{position:absolute;top:8px;right:8px;background:var(--card-on-solid);color:var(--card-solid);border-radius:99px;height:28px;padding:0 9px 0 7px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700}
.heart .svg{width:15px;height:15px}
.heart.on .svg{fill:var(--red);stroke:var(--red)}

/* insights chart: dashed grid and solid bars from one reference, hatched tracks from the other */
.chart{background:var(--deep);border-radius:var(--r);padding:16px 12px 12px}
.plot{position:relative;height:190px}
.plot .grid{position:absolute;inset:18px 0 0;background:repeating-linear-gradient(to bottom,var(--line-soft) 0 1px,transparent 1px 25%);-webkit-mask:repeating-linear-gradient(to right,#000 0 4px,transparent 4px 8px);mask:repeating-linear-gradient(to right,#000 0 4px,transparent 4px 8px)}
.bars{position:absolute;inset:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.bcol{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bcol::before{content:"";position:absolute;bottom:0;top:18px;width:16px;border-radius:5px;background:repeating-linear-gradient(135deg,var(--line-soft) 0 1.5px,transparent 1.5px 6px)}
.bcol .v{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;margin-bottom:6px;position:relative}
.bcol .b{position:relative;width:16px;border-radius:4px;background:var(--ink)}
.bcol .b::before{content:"";position:absolute;left:50%;top:-8px;height:8px;width:1.5px;transform:translateX(-50%);background:inherit}
.bcol.max .b{background:var(--orange)}
.bcol.max .v{color:var(--orange);font-weight:700}
.blabels{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:10px;font-size:12px;font-weight:500;text-align:center}
.rowline{box-shadow:inset 0 0 0 1.5px var(--line);border-radius:20px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.rowline b{font-size:17px;letter-spacing:-.015em;display:block}
.rowline .val{font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}

/* nav: black pill with grey active pill */
.nav{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20;pointer-events:none}
.nav-in{max-width:488px;margin:0 auto;background:var(--nav-bg);color:var(--nav-fg);border-radius:99px;padding:6px;display:grid;grid-template-columns:repeat(5,1fr);pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.nav button{height:50px;display:grid;place-items:center;color:var(--nav-fg)}
.nav button span{width:100%;height:100%;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.nav button[aria-current="page"] span{background:var(--nav-active)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,8,.42);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);color:var(--ink);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .chips{margin-inline:0;padding-inline:0}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 2px}
.sheet-head{display:flex;align-items:flex-start;gap:12px}
.sheet-head h2{flex:1;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.05;min-width:0;overflow-wrap:anywhere}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--solid);color:var(--on-solid);border-radius:99px;padding:11px 18px;font-size:14px;font-weight:500;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.big{font-size:38px}.top.page h1{font-size:27px}}
</style>

<main class="app" id="view" aria-live="polite"></main>
<nav class="nav" aria-label="Sections"><div class="nav-in" id="nav"></div></nav>
<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const I = {
  home:'<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>',
  list:'<path d="M5 9h14l-1.4 9.2a2 2 0 0 1-2 1.8H8.4a2 2 0 0 1-2-1.8z"/><path d="M9 9l3-5 3 5"/>',
  recipes:'<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/>',
  nest:'<path d="M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/><path d="M3 13a2 2 0 0 1 4 0v2h10v-2a2 2 0 0 1 4 0v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M6 18v2M18 18v2"/>',
  budget:'<path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', check:'<path d="m5 12.5 4.5 4.5L19 7"/>',
  heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>', down:'<path d="m6 9 6 6 6-6"/>',
  euro:'<path d="M17 6.5A6.5 6.5 0 1 0 17 17.5"/><path d="M4.5 10.5h9M4.5 13.5h9"/>',
  clock:'<circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/>'
};
const ic = (n, cls='') => `<svg class="svg ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const TABS = [['home','Home'],['list','Shopping list'],['recipes','Recipes'],['nest','Home & furniture'],['budget','Insights']];
const COLORS = ['blue','yellow','mint','tan','orange','olive','khaki','silver','red'];
const AISLES = [
  ['Produce','mint',/\b(apple|banana|avocado|lemon|lime|onion|shallot|garlic|tomato|potato|carrot|lettuce|spinach|rocket|arugula|herb|basil|cilantro|coriander|parsley|mint|pepper|chilli|chili|cucumber|berr|grape|orange|ginger|mushroom|zucchini|courgette|broccoli|kale|cabbage|celery|leek|squash|pumpkin|fruit|veg|salad|scallion|spring onion)/],
  ['Dairy & eggs','blue',/\b(milk|cheese|yog(h)?urt|butter|cream|egg|feta|parmesan|mozzarella|ricotta|cheddar|halloumi)/],
  ['Bakery','tan',/\b(bread|bagel|baguette|tortilla|wrap|bun|croissant|pita|naan|sourdough)/],
  ['Meat & fish','red',/\b(chicken|beef|pork|salmon|fish|cod|shrimp|prawn|bacon|sausage|turkey|tuna|lamb|mince|chorizo|ham)/],
  ['Pantry','yellow',/\b(rice|pasta|spaghetti|flour|sugar|oil|salt|bean|lentil|chickpea|sauce|stock|broth|spice|cumin|paprika|cinnamon|honey|vinegar|oat|coffee|tea|cereal|nut|tin|canned|noodle|soy|miso|tahini|mustard|ketchup|mayo|jam|chocolate|curry|coconut|quinoa|couscous|wine)/],
  ['Frozen','silver',/\b(frozen|ice cream|peas)/],
  ['Household','olive',/\b(soap|detergent|paper|towel|tissue|sponge|bin bag|trash|toothpaste|shampoo|foil|cling|batter(y|ies)|bulb|cleaner|dish)/],
  ['Other','khaki',null]
];
const AISLE_COLOR = Object.fromEntries(AISLES.map(a=>[a[0],a[1]]));
const ROOMS = ['Living room','Bedroom','Kitchen','Dining','Bathroom','Office','Hallway','Outdoor'];
const STATUS = {idea:['Idea','On the moodboard'],planned:['To buy','On the purchase list'],bought:['Bought','Paid for']};
const DEFAULTS = {groceries:600, home:4000};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let NF, NF0;
try { NF = new Intl.NumberFormat(undefined,{style:'currency',currency:'EUR'}); NF0 = new Intl.NumberFormat(undefined,{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:0}); }
catch { NF = new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}); NF0 = new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:0}); }
const money = n => NF.format(+n || 0);
const money0 = n => NF0.format(Math.round(+n || 0));
const bigMoney = n => {
  const parts = NF.formatToParts(+n || 0); const i = parts.findIndex(p => p.type === 'decimal');
  if (i < 0) return esc(parts.map(p => p.value).join(''));
  return esc(parts.slice(0, i).map(p => p.value).join('')) + `<span class="c">${esc(parts.slice(i).map(p => p.value).join(''))}</span>`;
};
const num = v => {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v ?? '').replace(/[^0-9.,\-]/g, '');
  if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
  s = s.replace(/,/g, '');
  const n = parseFloat(s); return isFinite(n) ? n : 0;
};
const today = () => iso(new Date());
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseD = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const fmtDate = s => parseD(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const monthKey = s => String(s||'').slice(0,7);
const thisMonth = () => today().slice(0,7);
const monthName = () => new Date().toLocaleDateString('en-GB',{month:'long'});
const hashColor = s => { let h=0; for (const c of String(s)) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; };
const guessAisle = name => { const n = ' '+String(name).toLowerCase(); for (const [a,,re] of AISLES) if (re && re.test(n)) return a; return 'Other'; };
const parseIng = line => {
  const m = String(line).trim().match(/^((?:\d+[\d\/.,]*|[½¼¾⅓⅔])\s*(?:-\s*\d+\s*)?(?:g|kg|ml|l|oz|lb|cups?|tbsp|tsp|cloves?|cans?|tins?|bunch(?:es)?|handful|pinch|x|pcs?|slices?)?\.?)\s+(.+)$/i);
  return m ? {qty:m[1].trim(), name:m[2].trim()} : {qty:'', name:String(line).trim()};
};
const rid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);

/* ---------- state ---------- */
const S = {shop:[], recipes:[], furniture:[], spend:[], settings:{}};
const COLS = ['shop','recipes','furniture','spend'];
let mode = 'loading', db = null, userApi = null, assets = null, me = null, people = {};
const ui = { open:null, tab:'home', rtag:'All', rq:'', nestView:'board', room:'All', range:'week' };
try { const h = location.hash.slice(1); if (TABS.some(t=>t[0]===h)) ui.tab = h; } catch {}

const limits = () => ({ groceries: num(S.settings.groceries ?? DEFAULTS.groceries) || DEFAULTS.groceries, home: num(S.settings.home ?? DEFAULTS.home) || DEFAULTS.home });

/* ---------- store adapter ---------- */
const LKEY = 'our-nest-local-v1';
function goLocal() {
  if (mode === 'live') return;
  mode = 'local';
  try { const saved = JSON.parse(localStorage.getItem(LKEY) || 'null'); if (saved) Object.assign(S, saved); } catch {}
  render();
}
function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify(S)); } catch {} }
const errMsg = e => e && e.code === 'quota_exceeded' ? 'Storage is full. Delete a few old items and try again.'
  : e && e.code === 'invalid_argument' ? 'You have view-only access, so changes can’t be saved.'
  : 'That didn’t save. Check your connection and try again.';
async function add(col, data) {
  data = {by: me || 'me', createdAt: Date.now(), ...data};
  if (mode === 'live') {
    try { const ref = await db.collection(col).add(data); return ref.id; } catch (e) { toast(errMsg(e)); return null; }
  }
  const id = rid(); S[col].push({id, ...data}); saveLocal(); render(); return id;
}
async function upd(col, id, patch) {
  if (mode === 'live') { try { await db.collection(col).doc(id).update(patch); } catch (e) { toast(errMsg(e)); } return; }
  const it = S[col].find(x => x.id === id); if (it) Object.assign(it, patch); saveLocal(); render();
}
async function del(col, id) {
  if (mode === 'live') { try { await db.collection(col).doc(id).delete(); } catch (e) { toast(errMsg(e)); } return; }
  S[col] = S[col].filter(x => x.id !== id); saveLocal(); render();
}
async function saveSettings(patch) {
  const next = {...S.settings, ...patch};
  if (mode === 'live') { try { await db.doc('budget/settings').set(next); } catch (e) { toast(errMsg(e)); } return; }
  S.settings = next; saveLocal(); render();
}

/* ---------- people ---------- */
let peopleKey = '';
function idsInUse() {
  const s = new Set(); if (me) s.add(me);
  for (const c of COLS) for (const d of S[c]) { if (d.by && d.by !== 'me') s.add(d.by); (d.likes||[]).forEach(x => s.add(x)); }
  return [...s];
}
let profTimer;
function refreshPeople() {
  if (!userApi) return;
  clearTimeout(profTimer);
  profTimer = setTimeout(async () => {
    const ids = idsInUse(); if (!ids.length) return;
    try {
      const p = await userApi.profiles(ids);
      const key = JSON.stringify(Object.entries(p).map(([k,v]) => [k, v.name, v.avatarUrl]));
      if (key !== peopleKey) { peopleKey = key; people = p; render(); }
    } catch {}
  }, 150);
}
const partnerId = () => idsInUse().find(x => x !== me) || null;
const firstName = id => { if (!id || id === 'me' || id === me) return 'You'; const n = (people[id]?.name || '').split(' ')[0]; return n || 'Partner'; };
function avatar(id, cls='') {
  const p = people[id]; const isMe = !id || id === me || id === 'me';

  return `<span class="av ${cls}" style="background:${bg}" title="${esc(label)}">${inner}</span>`;

/* ---------- derived numbers ---------- */
function totals() {
  const L = limits(), m = thisMonth();
  const groc = S.spend.filter(s => s.section === 'groceries' && monthKey(s.date) === m).reduce((a,s) => a + num(s.amount), 0);
  const home = S.spend.filter(s => s.section === 'home').reduce((a,s) => a + num(s.amount), 0);
  const planned = S.furniture.filter(f => f.status === 'planned').reduce((a,f) => a + num(f.price), 0);
  return {L, groc, home, planned, grocLeft: L.groceries - groc, homeLeft: L.home - home};
}

const pct = (v, l) => Math.max(0, Math.min(100, v / l * 100));

function vBudget() {
  const t = totals(), L = t.L;
  const days = [];
  if (ui.range === 'week') {
    for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const k = iso(d); days.push({label: d.toLocaleDateString('en-GB',{weekday:'short'}), match: s => s.date === k}); }
  } else {
    const now = new Date(), y = now.getFullYear(), m = now.getMonth(), last = new Date(y, m+1, 0).getDate();
    for (let w = 0; w * 7 < last; w++) { const a = w*7+1, b = Math.min(last, a+6); days.push({label: `${a}–${b}`, match: s => { const d = parseD(s.date); return d.getFullYear()===y && d.getMonth()===m && d.getDate()>=a && d.getDate()<=b; }}); }
  }
  const cols = days.map(d => ({...d, v: S.spend.filter(d.match).reduce((a,s) => a + num(s.amount), 0)}));
  const max = Math.max(0, ...cols.map(c => c.v)), top = max > 0 ? niceMax(max) : 100;
  const monthTotal = S.spend.filter(s => monthKey(s.date) === thisMonth()).reduce((a,s) => a + num(s.amount), 0);
  const hist = [...S.spend].sort((a,b) => (b.date||'').localeCompare(a.date||'') || b.createdAt - a.createdAt);
  return `${pageHead('Budgeting and<br>Spending Insights', '', `<button class="pill-btn" data-act="range">${ui.range === 'week' ? 'Week' : 'Month'} ${ic('down')}</button>`)}

    <div class="blabels">${cols.map(c => `<span>${esc(c.label)}</span>`).join('')}</div>
  </section>

  <div class="tiles grid">
    <div class="tile"><span class="hd"><span class="sqi">${ic('list','sm')}</span><span><span class="amt">${money0(t.groc)}</span><span class="sm">of ${money0(L.groceries)}</span></span></span><span><span class="nm">Groceries</span><span class="sm">${t.grocLeft < 0 ? `<span class="warn">${money0(-t.grocLeft)} over</span>` : money0(t.grocLeft) + ' left this month'}</span><span class="meter" style="margin-top:8px"><i class="${t.grocLeft<0?'over':''}" style="width:${pct(t.groc, L.groceries)}%"></i></span></span></div>
    <div class="tile"><span class="hd"><span class="sqi">${ic('nest','sm')}</span><span><span class="amt">${money0(t.home)}</span><span class="sm">of ${money0(L.home)}</span></span></span><span><span class="nm">Home fund</span><span class="sm">${money0(t.planned)} more planned</span><span class="meter" style="margin-top:8px"><i class="${t.homeLeft<0?'over':''}" style="width:${pct(t.home, L.home)}%"></i></span></span></div>
  </div>
  <button class="btn ghost" data-act="limits">Edit budgets</button>
  <section class="sec">
    <div class="sec-head"><h2>History</h2><button class="pill-btn" data-act="spend-new">${ic('plus')} Add</button></div>
    ${hist.length ? `<div class="wallet">${hist.map(spendCard).join('')}</div>` : `<div class="empty"><b>No expenses yet</b><span>Everything you check out or mark as bought lands here.</span></div>`}
  </section>`;
}
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if (m*p >= v) return m*p; return 10*p; }

  const y = window.scrollY;

const find = (col, id) => S[col].find(x => x.id === id);
async function markBought(f) {
  const sid = await add('spend', {label: f.name, amount: num(f.price), section:'home', date: today(), furnitureId: f.id});
  if (sid !== null) { await upd('furniture', f.id, {status:'bought', spendId: sid}); toast(`${money0(f.price)} taken from the home fund`); }
}
async function unbuy(f) {
  const linked = S.spend.filter(s => s.furnitureId === f.id);
  for (const s of linked) await del('spend', s.id);
  await upd('furniture', f.id, {status:'planned', spendId: null});
}
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]'); if (g) { closeSheet(); go(g.dataset.go); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'close-scrim' && e.target !== b) return;
  switch (act) {
    case 'close': case 'close-scrim': closeSheet(); break;
    case 'quick': quickSheet(); break;
    case 'toggle': ui.open = ui.open === id ? null : id; render(); break;
    case 'open-buy': closeSheet(); ui.nestView = 'buy'; ui.room = 'All'; ui.open = 'f-' + id; if (ui.tab === 'nest') render(); else go('nest'); break;
    case 'recipe-edit-id': { const r = find('recipes', id); if (r) recipeSheet(r); break; }
    case 'del-inline': {
      if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Tap again to delete'; break; }
      const col = b.dataset.col;
      if (col === 'spend') { const s = find('spend', id); if (s?.furnitureId && find('furniture', s.furnitureId)) await upd('furniture', s.furnitureId, {status:'planned', spendId:null}); }
      ui.open = null; await del(col, id); break;
    }
    case 'q': closeSheet(); ({list: () => { go('list'); setTimeout(() => document.getElementById('shop-quick-name')?.focus(), 50); }, recipe: () => recipeSheet(), furn: () => furnSheet(), spend: () => spendSheet()})[b.dataset.v](); break;
    case 'shop-toggle': { const x = find('shop', id); if (x) upd('shop', id, {done: !x.done}); break; }
    case 'shop-edit': { const x = find('shop', id); if (x) shopSheet(x); break; }
    case 'checkout': checkoutSheet(); break;
    case 'spend-new': spendSheet(); break;
    case 'spend-edit': { const s = find('spend', id); if (s) spendSheet(s); break; }
    case 'limits': limitsSheet(); break;
    case 'range': ui.range = ui.range === 'week' ? 'month' : 'week'; render(); break;
    case 'rtag': ui.rtag = b.dataset.v; render(); break;
    case 'recipe-new': recipeSheet(); break;
    case 'recipe-open': { const r = find('recipes', id); if (r) recipeOpen(r); break; }
    case 'recipe-edit': recipeSheet(sheetCtx.recipe); break;
    case 'ing': { const i = +b.dataset.i, sel = sheetCtx.sel; sel.has(i) ? sel.delete(i) : sel.add(i); const y = root.querySelector('.sheet').scrollTop; sheetCtx.draw(); root.querySelector('.sheet').scrollTop = y; break; }
    case 'ing-add': {
      const r = sheetCtx.recipe, picked = (r.ingredients||[]).filter((_, i) => sheetCtx.sel.has(i));
      closeSheet();
      for (const line of picked) { const {qty, name} = parseIng(line); await add('shop', {name, qty, aisle: guessAisle(name), done:false, recipe: r.title}); }
      toast(`${picked.length} added to the shopping list`); break;
    }
    case 'pick-color': { root.querySelectorAll('.sw').forEach(s => s.setAttribute('aria-pressed', s === b)); document.getElementById('rf-color').value = b.dataset.v; break; }
    case 'pick-status': { b.parentElement.querySelectorAll('button').forEach(s => s.setAttribute('aria-pressed', s === b)); document.getElementById('ff-status').value = b.dataset.v; break; }
    case 'nestview': ui.nestView = b.dataset.v; render(); break;
    case 'room': ui.room = b.dataset.v; render(); break;
    case 'furn-new': furnSheet(); break;
    case 'furn-edit': { const f = find('furniture', id); if (f) furnSheet(f); break; }
    case 'like': { const f = find('furniture', id); if (!f || !me) { if (!me) toast('Sign in to heart pieces'); break; } const l = new Set(f.likes || []); l.has(me) ? l.delete(me) : l.add(me); upd('furniture', id, {likes: [...l]}); break; }
    case 'buy': { const f = find('furniture', id); if (f) { if (!num(f.price)) { furnSheet(f); toast('Add a price first'); } else markBought(f); } break; }
    case 'unbuy': { const f = find('furniture', id); if (f) unbuy(f); break; }
    case 'confirm-del': {
      if (b.dataset.armed) {
        const {col, id: did} = sheetCtx; closeSheet();
        if (col === 'spend') { const s = find('spend', did); if (s?.furnitureId && find('furniture', s.furnitureId)) await upd('furniture', s.furnitureId, {status:'planned', spendId:null}); }
        if (col === 'furniture') { const f = find('furniture', did); if (f?.status === 'bought') toast('Removed. Its expense stays in the history.'); }
        await del(col, did);
      } else { b.dataset.armed = '1'; b.textContent = 'Tap again to delete'; }
      break;
    }
  }
});

});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(f).entries()), kind = f.dataset.form, id = f.dataset.id;
  switch (kind) {
    case 'shop-quick': {
      const raw = (fd.name || '').trim(); if (!raw) return;
      const {qty, name} = parseIng(raw);
      document.getElementById('shop-quick-name').value = '';
      await add('shop', {name, qty, aisle: guessAisle(name), done:false});
      break;
    }
    case 'shop-edit': closeSheet(); await upd('shop', id, {name: fd.name.trim(), qty: fd.qty.trim(), price: fd.price ? num(fd.price) : null, aisle: fd.aisle}); break;
    case 'checkout': {
      const done = S.shop.filter(x => x.done); closeSheet();
      const sid = await add('spend', {label: fd.store.trim() || 'Grocery run', amount: num(fd.total), section:'groceries', date: fd.date || today(), items: done.length});
      if (sid === null) return;
      for (const x of done) await del('shop', x.id);
      toast(`${money(num(fd.total))} logged to groceries`); break;
    }
    case 'spend': {
      const data = {label: fd.label.trim(), amount: num(fd.amount), date: fd.date || today(), section: fd.section};
      closeSheet();
      if (id) await upd('spend', id, data); else await add('spend', data);
      break;
    }
    case 'limits': closeSheet(); await saveSettings({groceries: num(fd.groceries) || DEFAULTS.groceries, home: num(fd.home) || DEFAULTS.home}); toast('Budgets saved'); break;
    case 'recipe': {
      const lines = s => String(s || '').split('\n').map(x => x.replace(/^\s*(\d+[.)]|[-•*])\s*/, '').trim()).filter(Boolean);
      const data = {title: fd.title.trim(), time: fd.time.trim(), serves: fd.serves.trim(), tag: fd.tag.trim(), ingredients: lines(fd.ingredients), steps: lines(fd.steps), notes: fd.notes.trim(), color: fd.color || hashColor(fd.title)};
      closeSheet();
      if (id) await upd('recipes', id, data); else { await add('recipes', data); go('recipes'); }
      break;
    }
    case 'furn': {
      const file = f.querySelector('#ff-file')?.files?.[0];
      const prev = sheetCtx.item || {};
      const data = {name: fd.name.trim(), room: fd.room, price: fd.price ? num(fd.price) : null, store: fd.store.trim(), link: fd.link.trim(), status: fd.status || 'idea', notes: fd.notes.trim()};
      if (fd.hex) data.hex = fd.hex;
      const btn = f.querySelector('[type=submit]');
      if (file && assets) {
        btn.disabled = true; btn.textContent = 'Uploading photo…';
        try { const r = await assets.upload(file); data.image = r.id; }
        catch (err) { btn.disabled = false; btn.textContent = 'Save'; toast(err?.code === 'too_large' ? 'That photo is over 20 MB. Try a smaller one.' : 'The photo didn’t upload. Try again, or save without it.'); return; }
      }
      closeSheet();
      if (id) {
        await upd('furniture', id, data);
        const now = find('furniture', id) || {...prev, ...data};
        if (prev.status !== 'bought' && data.status === 'bought') { if (num(data.price)) await markBought({...now, ...data, id}); else toast('Add a price so it can come out of the home fund'); }
        if (prev.status === 'bought' && data.status !== 'bought') { for (const s of S.spend.filter(s => s.furnitureId === id)) await del('spend', s.id); }
      } else {
        const nid = await add('furniture', {...data, likes: me ? [me] : [], color: hashColor(data.name)});
        if (nid && data.status === 'bought' && num(data.price)) await markBought({...data, id: nid});
      }
      break;
    }
  }
});

/* ---------- boot ---------- */
async function boot() {
  render();
  const use = n => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const timer = setTimeout(() => { if (mode === 'loading') goLocal(); }, 10000);
  const [d, u, a] = await Promise.all([use('db'), use('user'), use('assets')]);
  userApi = u; assets = a;
  if (u) { try { me = await u.id(); } catch {} }
  if (!d) { clearTimeout(timer); goLocal(); return; }
  db = d;
  const got = new Set();
  const ready = () => { if (got.size >= COLS.length + 1 && mode === 'loading') { mode = 'live'; clearTimeout(timer); } };
  let rT; const soon = () => { clearTimeout(rT); rT = setTimeout(() => { render(); refreshPeople(); }, 30); };
  const onErr = e => { if (e && (e.code === 'revoked' || e.code === 'not_granted' || e.code === 'capability_disabled')) { mode = 'loading'; db = null; goLocal(); } };
  for (const c of COLS) db.collection(c).onSnapshot(snap => { S[c] = snap.docs.map(x => ({id: x.id, ...x.data()})); got.add(c); ready(); soon(); }, onErr);
  db.doc('budget/settings').onSnapshot(snap => { S.settings = snap.exists ? {...snap.data()} : {}; got.add('settings'); ready(); soon(); }, onErr);
  refreshPeople();
}
boot();
})();
</script>
